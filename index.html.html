<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ledger — Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0F1A;
      color: #E8E4D9;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-top: 70px;
      padding-bottom: 20px;
    }
    ::-webkit-scrollbar { display: none; }

    /* Header */
    .header { padding: 16px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: 28px; color: #C9A94B; line-height: 1.1; }
    .header .sub { font-size: 13px; color: #6B7A8D; margin-top: 4px; }

    /* Cards */
    .card { background: #141824; border: 1px solid #1E2535; border-radius: 16px; padding: 20px 22px; margin: 16px 24px 0; }
    .stat-label { font-size: 12px; color: #6B7A8D; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-value { font-family: 'DM Serif Display', serif; font-size: 22px; color: #C9A94B; margin-top: 4px; }
    .two-col { display: flex; gap: 12px; margin: 20px 24px 0; }
    .two-col .card { margin: 0; flex: 1; }

    /* Section title */
    .section-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5568; margin: 24px 24px 8px; }

    /* Expense item */
    .exp-item { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid #1A2030; }
    .exp-item:last-child { border-bottom: none; }
    .cat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .exp-info { flex: 1; min-width: 0; }
    .exp-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-meta { font-size: 12px; color: #4A5568; margin-top: 2px; }
    .exp-amount { color: #C9A94B; font-weight: 600; font-size: 15px; flex-shrink: 0; }

    /* Nav */
    nav { position: fixed; top: 0; left: 0; right: 0; background: #0D1120; border-bottom: 1px solid #1E2535; display: flex; justify-content: space-around; align-items: center; padding: 10px 0 10px; z-index: 100; }
    .nav-btn { background: none; border: none; color: #4A5568; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 16px; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
    .nav-btn.active { color: #C9A94B; }
    .nav-btn .nav-icon { font-size: 20px; }
    .add-btn { background: #C9A94B; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 24px; cursor: pointer; box-shadow: 0 0 20px #C9A94B55; display: flex; align-items: center; justify-content: center; color: #0B0F1A; line-height: 1; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Form */
    .form-wrap { margin: 24px 24px 0; display: flex; flex-direction: column; gap: 18px; }
    .form-label { font-size: 12px; color: #6B7A8D; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; background: #1A2030; border: 1px solid #252F44; border-radius: 10px; color: #E8E4D9; font-size: 15px; padding: 14px 16px; outline: none; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s; }
    .form-input:focus { border-color: #C9A94B; }
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cat-btn { background: #1A2030; border: 1px solid #252F44; border-radius: 10px; color: #8899AA; padding: 10px 12px; cursor: pointer; font-size: 13px; text-align: left; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .cat-btn.selected { border-color: var(--cat-color); color: var(--cat-color); background: var(--cat-bg); }
    .submit-btn { background: #C9A94B; color: #0B0F1A; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; font-family: 'DM Sans', sans-serif; letter-spacing: 0.04em; transition: opacity 0.2s; }
    .submit-btn:active { opacity: 0.8; }

    /* Bar chart */
    .bar-row { margin-bottom: 14px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .bar-label .bar-amt { color: #8899AA; }
    .bar-track { height: 4px; background: #1E2535; border-radius: 4px; }
    .bar-fill { height: 4px; border-radius: 4px; transition: width 0.5s ease; }

    /* Filter chips */
    .filter-wrap { overflow-x: auto; display: flex; gap: 8px; padding: 16px 24px 0; scrollbar-width: none; }
    .filter-chip { flex-shrink: 0; border: none; border-radius: 100px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; background: #1A2030; color: #8899AA; }
    .filter-chip.active { background: #C9A94B; color: #0B0F1A; font-weight: 700; }

    /* Delete btn */
    .del-btn { background: #7F1D1D33; border: 1px solid #7F1D1D55; color: #F87171; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    /* Toast */
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); border-radius: 100px; padding: 10px 20px; font-size: 13px; z-index: 999; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: #14532D; color: #fff; }
    #toast.error { background: #7F1D1D; color: #fff; }

    .empty { text-align: center; color: #4A5568; padding: 40px 0; font-size: 14px; }
    .top-cat-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .top-cat-name { font-weight: 600; font-size: 16px; }
    .top-cat-amt { color: #C9A94B; font-size: 14px; }
    .history-amount-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  </style>
</head>
<body>

<div id="toast"></div>

<!-- DASHBOARD -->
<div id="view-dashboard" class="view active">
  <div class="header">
    <div>
      <h1>Ledger</h1>
      <div class="sub">Personal Expense Tracker</div>
    </div>
    <span style="font-size:24px">💰</span>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="stat-label">This Month</div>
      <div class="stat-value" id="stat-month">Rp 0</div>
    </div>
    <div class="card">
      <div class="stat-label">All Time</div>
      <div class="stat-value" id="stat-total">Rp 0</div>
    </div>
  </div>

  <div class="card" id="top-cat-card" style="display:none">
    <div class="stat-label">Top Category</div>
    <div class="top-cat-row">
      <span id="top-cat-icon" style="font-size:28px"></span>
      <div>
        <div class="top-cat-name" id="top-cat-name"></div>
        <div class="top-cat-amt" id="top-cat-amt"></div>
      </div>
    </div>
  </div>

  <div id="breakdown-section" style="display:none">
    <div class="section-title">Breakdown</div>
    <div class="card" id="breakdown-bars" style="padding:16px 20px"></div>
  </div>

  <div class="section-title">Recent</div>
  <div class="card" id="recent-list" style="padding:0;overflow:hidden">
    <div class="empty">No expenses yet. Tap + to add one.</div>
  </div>
</div>

<!-- ADD -->
<div id="view-add" class="view">
  <div class="header">
    <div>
      <h1>Add Expense</h1>
      <div class="sub">Track a new spending</div>
    </div>
  </div>
  <div class="form-wrap">
    <div>
      <label class="form-label">Amount (IDR)</label>
      <input class="form-input" type="number" id="input-amount" placeholder="e.g. 50000" inputmode="numeric" />
    </div>
    <div>
      <label class="form-label">Category</label>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div>
      <label class="form-label">Note (optional)</label>
      <input class="form-input" type="text" id="input-note" placeholder="e.g. Lunch at Warteg" />
    </div>
    <div>
      <label class="form-label">Date</label>
      <input class="form-input" type="date" id="input-date" />
    </div>
    <button class="submit-btn" onclick="addExpense()">Add Expense</button>
  </div>
</div>

<!-- HISTORY -->
<div id="view-history" class="view">
  <div class="header">
    <div>
      <h1>History</h1>
      <div class="sub" id="history-count">0 expenses total</div>
    </div>
  </div>
  <div class="filter-wrap" id="filter-chips"></div>
  <div class="card" id="history-list" style="padding:0;overflow:hidden;margin-top:16px">
    <div class="empty">No expenses here.</div>
  </div>
</div>

<!-- NAV -->
<nav>
  <button class="nav-btn active" id="nav-dashboard" onclick="switchView('dashboard')">
    <span class="nav-icon">📊</span>Dashboard
  </button>
  <button class="add-btn" onclick="switchView('add')">+</button>
  <button class="nav-btn" id="nav-history" onclick="switchView('history')">
    <span class="nav-icon">🧾</span>History
  </button>
</nav>

<script>
const CATEGORIES = [
  { name: "Food & Dining", icon: "🍽️", color: "#F59E0B" },
  { name: "Transport",     icon: "🚗", color: "#3B82F6" },
  { name: "Shopping",      icon: "🛍️", color: "#EC4899" },
  { name: "Entertainment", icon: "🎬", color: "#8B5CF6" },
  { name: "Health",        icon: "💊", color: "#10B981" },
  { name: "Housing",       icon: "🏠", color: "#EF4444" },
  { name: "Education",     icon: "📚", color: "#06B6D4" },
  { name: "Other",         icon: "💼", color: "#6B7280" },
];

let expenses = [];
let selectedCat = "Food & Dining";
let filterCat = "All";
let currentView = "dashboard";

const fmt = n => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

function getCat(name) { return CATEGORIES.find(c => c.name === name) || CATEGORIES[7]; }

// Storage
function saveExpenses() { localStorage.setItem("ledger-expenses", JSON.stringify(expenses)); }
function loadExpenses() {
  try { expenses = JSON.parse(localStorage.getItem("ledger-expenses") || "[]"); } catch { expenses = []; }
}

// Toast
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = (type === "error" ? "⚠️ " : "✓ ") + msg;
  t.className = `show ${type}`;
  setTimeout(() => { t.className = ""; }, 2500);
}

// View switching
function switchView(v) {
  currentView = v;
  ["dashboard", "add", "history"].forEach(name => {
    document.getElementById(`view-${name}`).classList.toggle("active", name === v);
    const nb = document.getElementById(`nav-${name}`);
    if (nb) nb.classList.toggle("active", name === v);
  });
  if (v === "dashboard") renderDashboard();
  if (v === "history") renderHistory();
}

// Build category grid
function buildCatGrid() {
  const grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  CATEGORIES.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (c.name === selectedCat ? " selected" : "");
    btn.style.setProperty("--cat-color", c.color);
    btn.style.setProperty("--cat-bg", c.color + "33");
    btn.textContent = c.icon + " " + c.name;
    btn.onclick = () => { selectedCat = c.name; buildCatGrid(); };
    grid.appendChild(btn);
  });
}

// Add expense
function addExpense() {
  const amountVal = document.getElementById("input-amount").value;
  const note = document.getElementById("input-note").value.trim();
  const date = document.getElementById("input-date").value;
  if (!amountVal || isNaN(Number(amountVal)) || Number(amountVal) <= 0) {
    showToast("Enter a valid amount", "error"); return;
  }
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    amount: Number(amountVal),
    category: selectedCat,
    note,
    date: date || new Date().toISOString().slice(0, 10),
  };
  expenses.unshift(entry);
  saveExpenses();
  document.getElementById("input-amount").value = "";
  document.getElementById("input-note").value = "";
  showToast("Expense added!");
  switchView("dashboard");
}

// Delete
function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  saveExpenses();
  renderDashboard();
  renderHistory();
  showToast("Deleted");
}

// Dashboard
function renderDashboard() {
  const now = new Date().toISOString().slice(0, 7);
  const total = expenses.reduce((s, e) => s + e.amount, 0);
  const monthly = expenses.filter(e => e.date.slice(0, 7) === now).reduce((s, e) => s + e.amount, 0);

  document.getElementById("stat-total").textContent = fmt(total);
  document.getElementById("stat-month").textContent = fmt(monthly);

  // Category totals
  const catTotals = CATEGORIES.map(c => ({ ...c, total: expenses.filter(e => e.category === c.name).reduce((s, e) => s + e.amount, 0) }))
    .sort((a, b) => b.total - a.total);
  const maxCat = catTotals[0]?.total || 1;
  const topCat = catTotals[0];

  if (topCat && topCat.total > 0) {
    document.getElementById("top-cat-card").style.display = "";
    document.getElementById("top-cat-icon").textContent = topCat.icon;
    document.getElementById("top-cat-name").textContent = topCat.name;
    document.getElementById("top-cat-amt").textContent = fmt(topCat.total);
  } else {
    document.getElementById("top-cat-card").style.display = "none";
  }

  // Breakdown bars
  const barsSection = document.getElementById("breakdown-section");
  const barsEl = document.getElementById("breakdown-bars");
  const withData = catTotals.filter(c => c.total > 0);
  if (withData.length > 0) {
    barsSection.style.display = "";
    barsEl.innerHTML = withData.map(c => `
      <div class="bar-row">
        <div class="bar-label"><span>${c.icon} ${c.name}</span><span class="bar-amt">${fmt(c.total)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c.total/maxCat)*100}%;background:${c.color}"></div></div>
      </div>
    `).join("");
  } else {
    barsSection.style.display = "none";
  }

  // Recent
  const recentEl = document.getElementById("recent-list");
  const recent = expenses.slice(0, 5);
  if (recent.length === 0) {
    recentEl.innerHTML = '<div class="empty">No expenses yet. Tap + to add one.</div>';
  } else {
    recentEl.innerHTML = recent.map(e => {
      const cat = getCat(e.category);
      return `<div class="exp-item">
        <div class="cat-icon" style="background:${cat.color}22">${cat.icon}</div>
        <div class="exp-info">
          <div class="exp-name">${e.note || e.category}</div>
          <div class="exp-meta">${fmtDate(e.date)}</div>
        </div>
        <div class="exp-amount">${fmt(e.amount)}</div>
      </div>`;
    }).join("");
  }
}

// History
function renderHistory() {
  document.getElementById("history-count").textContent = expenses.length + " expenses total";

  // Filter chips
  const chipsEl = document.getElementById("filter-chips");
  chipsEl.innerHTML = ["All", ...CATEGORIES.map(c => c.name)].map(cat => {
    const label = cat === "All" ? "All" : getCat(cat).icon + " " + cat;
    return `<button class="filter-chip ${filterCat === cat ? "active" : ""}" onclick="setFilter('${cat}')">${label}</button>`;
  }).join("");

  // List
  const filtered = filterCat === "All" ? expenses : expenses.filter(e => e.category === filterCat);
  const listEl = document.getElementById("history-list");
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">No expenses here.</div>';
  } else {
    listEl.innerHTML = filtered.map(e => {
      const cat = getCat(e.category);
      return `<div class="exp-item">
        <div class="cat-icon" style="background:${cat.color}22">${cat.icon}</div>
        <div class="exp-info">
          <div class="exp-name">${e.note || e.category}</div>
          <div class="exp-meta">${e.category} · ${fmtDate(e.date)}</div>
        </div>
        <div class="history-amount-col">
          <div class="exp-amount">${fmt(e.amount)}</div>
          <button class="del-btn" onclick="deleteExpense('${e.id}')">delete</button>
        </div>
      </div>`;
    }).join("");
  }
}

function setFilter(cat) { filterCat = cat; renderHistory(); }

// Init
loadExpenses();
buildCatGrid();
document.getElementById("input-date").value = new Date().toISOString().slice(0, 10);
renderDashboard();
</script>
</body>
</html>
